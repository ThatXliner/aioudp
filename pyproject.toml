[tool.poetry]
name = "aioudp"
description = "A better API for asynchronous UDP"
authors = ["Bryan Hu <thatxliner@gmail.com>"]
version = "2.0.0"

readme = "README.md"
license = "GPL-3.0-or-later"

classifiers = [
    # Get the list of trove classifiers here: https://pypi.org/classifiers/
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
]
documentation = "https://aioudp.readthedocs.io/en/latest/index.html"
homepage = "https://github.com/ThatXliner/aioudp"
keywords = ["udp", "asyncio"] # Maximum of 5 keywords

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]
certifi = ">=2026.10.19"
hypothesis = "^6.68.2"
mypy = "^1.0.1"
pytest-clarity = "^1.0.1"
pytest-cov = "^4.0.0"

requests = { version = "^2.34.2", python = ">=3.10" }
urllib3 = { version = "^2.8.0", python = ">=3.10" }
Sphinx = { version = "^6.1.3", python = ">=3.10" }
toml = "^0.10.2"
ruff = "^0.1.8"
pytest-timeout = "^2.3.1"
# Formatting and lints run on 3.14 only. black 26.10.1 needs 3.10.
black = { version = "^26.10.1", python = ">=3.10" }
shed = { version = "^0.10.9", python = ">=3.10" }
# pytest 9 needs 3.10, and 8.3 is the last release for 3.8.
pytest = [
    { version = "^8.3.5", python = "<3.9" },
    { version = "^8.4.2", python = ">=3.9,<3.10" },
    { version = "^9.0.3", python = ">=3.10" },
]
# Matches the pytest split. Only 1.3 and later allow pytest 9.
pytest-asyncio = [
    { version = "^0.24.0", python = "<3.9" },
    { version = "^1.2.0", python = ">=3.9,<3.10" },
    { version = "^1.3.0", python = ">=3.10" },
]
# Pygments 2.20 needs 3.9.
pygments = [
    { version = "^2.19.2", python = "<3.9" },
    { version = "^2.20.0", python = ">=3.9" },
]

[tool.poe.tasks]
# Code linting
mypy = { cmd = "mypy aioudp --strict", help = "Run MyPy on codebase" }
ruff = { cmd = "ruff check aioudp", help = "Run Ruff on codebase" }
check_black = { cmd = "black aioudp --check" }
check_imports = { cmd = "ruff check aioudp --select I" }
style = ["check_black", "check_imports"]
codebase = ["ruff", "mypy"]
[tool.poe.tasks.docs]
cmd = "sphinx-build docs build"
help = "Build documentation"

[tool.poe.tasks.format]
cmd = "shed"
help = "Format code"

[tool.poe.tasks.fix-ruff]
cmd = "ruff aioudp --fix"
help = "Ruff autofix"

[tool.poe.tasks.lint]
sequence = ["style", "codebase"]
help = "Lint codebase"

[tool.poe.tasks.test]
cmd = "pytest -vvv --cov=aioudp"
help = "Simply run test suite"

[tool.poe.tasks.ci]
cmd = "pytest -vvv --cov=aioudp --cov-report=xml"
help = "This workflow is for Github Actions"

[tool.pytest.ini_options]
timeout = 60
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Same as Black.
line-length = 88
select = ["ALL"]
ignore = [
    "S101", # "Use of assert detected. I use assert for MyPy
    # "D",    # "No docs"
    # "T20", # "Don't use print or pprint"
    # "ANN",  # Type annotation errors (or the lack of it)
    "ANN101", # The type annotation for `self` is inferred
    "FIX002", # "Line contains TODO, consider resolving the issue"
    "FBT",    # I actually don't know why this exists
    # and it seems useless so ignore it
    # Fix doc rule conflicts
    "D203",
    "D213",
    "D407",
    "D406",
]
target-version = "py38"
[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]
"docs/conf.py" = ["INP001", "A001"]
