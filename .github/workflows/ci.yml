name: CI
on:
  schedule:
    - cron: "0 0 1 * *" # Monthly, to catch breakage from external dependencies
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Poetry 2 cannot run on Python 3.8, and 1.8.5 generated poetry.lock
  POETRY_VERSION: 1.8.5
defaults:
  run:
    shell: bash
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # ubuntu-24.04 rather than ubuntu-latest: actions/python-versions ships
        # no 3.8 or 3.9 builds for Ubuntu 26.04
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install Poetry and Poe
        run: python -m pip install "poetry==$POETRY_VERSION" poethepoet
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
      - name: Run test suite
        run: poe ci
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          python -m pip install "poetry==$POETRY_VERSION" poethepoet
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
      - name: Build docs
        run: poe docs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"
      - name: Check lock file
        run: poetry check --lock
      - name: Build project
        run: poetry build
  lints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          python -m pip install "poetry==$POETRY_VERSION" poethepoet
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
      - name: Run style lints
        run: poe style
      - name: Run ruff lints
        run: poe ruff
      - name: Run mypy lints
        run: poe mypy
